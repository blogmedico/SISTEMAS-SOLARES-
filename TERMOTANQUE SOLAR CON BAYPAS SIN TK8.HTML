<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Técnico: Solar Heat Pipe + Bypass Gas</title>
    <style>
        :root {
            --solar-orange: #f39c12;
            --gas-blue: #2c3e50;
            --cold-blue: #3498db;
            --hot-red: #e74c3c;
            --pipe-gray: #bdc3c7;
            --valve-open: #27ae60;
            --valve-closed: #c0392b;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #eaeff2; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-container { max-width: 1000px; width: 100%; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        h1 { color: var(--gas-blue); text-align: center; border-bottom: 4px solid var(--solar-orange); padding-bottom: 10px; }

        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 15px 20px; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 1rem; }
        #btn-sunny { background: var(--solar-orange); }
        #btn-cloudy { background: #7f8c8d; }
        #btn-maint { background: var(--gas-blue); }
        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* SIMULADOR SVG */
        .svg-container { width: 100%; background: #fdfdfd; border: 2px solid #bdc3c7; border-radius: 10px; margin: 20px 0; }
        
        .flow-line { fill: none; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 15, 10; animation: dash 1s linear infinite; display: none; }
        @keyframes dash { to { stroke-dashoffset: -25; } }

        .pipe { fill: none; stroke: var(--pipe-gray); stroke-width: 10; stroke-linejoin: round; }
        .valve { stroke-width: 2; transition: 0.3s; }
        .label { font-size: 14px; font-weight: bold; fill: var(--gas-blue); }

        .info-panel { display: none; background: var(--gas-blue); color: white; padding: 20px; border-radius: 10px; margin-top: 15px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="main-container">
    <h1>Simulador de Instalación Solar (Serie/Bypass)</h1>

    <div class="controls">
        <button class="btn" id="btn-sunny" onclick="setSim('sunny')">☀️ VERANO (Solar Directo)</button>
        <button class="btn" id="btn-cloudy" onclick="setSim('cloudy')">☁️ INVIERNO (Solar + Gas)</button>
        <button class="btn" id="btn-maint" onclick="setSim('maint')">🔧 MANTENIMIENTO (Solo Gas)</button>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- CAÑERÍA DE RED Y IONIS -->
            <path d="M 50 400 L 150 400 L 150 150 L 250 150" class="pipe" />
            <rect x="135" y="320" width="30" height="40" fill="#f1c40f" />
            <text x="170" y="345" class="label" style="font-size:12px">Equipo IONIS</text>

            <!-- TANQUE SOLAR HEAT PIPE -->
            <rect x="250" y="80" width="160" height="100" rx="10" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="3"/>
            <text x="270" y="135" class="label">SOLAR HEAT PIPE</text>
            
            <!-- PUENTE DE BYPASS (MANTENIMIENTO) -->
            <path d="M 150 250 L 550 250 L 550 350" class="pipe" />
            <text x="300" y="240" class="label" style="fill:var(--cold-blue)">PUENTE DE BYPASS</text>

            <!-- CALEFÓN A GAS -->
            <rect x="500" y="350" width="100" height="70" fill="#34495e" />
            <text x="515" y="390" class="label" style="fill:white">CALEFÓN</text>

            <!-- CONEXIÓN SOLAR A CALEFÓN -->
            <path d="M 410 130 L 650 130 L 650 350 L 600 350" class="pipe" />
            
            <!-- SALIDAS A CONSUMO -->
            <path d="M 650 250 L 750 250" class="pipe" /> <!-- Salida directa solar -->
            <path d="M 550 420 L 550 470 L 750 470" class="pipe" /> <!-- Salida desde gas -->

            <!-- VÁLVULAS (Círculos) -->
            <circle cx="200" cy="150" r="12" class="valve" id="v_in" fill="var(--valve-open)" /> 
            <text x="170" y="125" font-size="10">Entrada Solar</text>
            
            <circle cx="350" cy="250" r="12" class="valve" id="v_bridge" fill="var(--valve-open)" />
            <text x="330" y="280" font-size="10">V. Puente</text>
            
            <circle cx="650" cy="250" r="12" class="valve" id="v_direct" fill="var(--valve-open)" />
            <text x="670" y="255" font-size="10">V. Directa</text>

            <!-- FLUJOS ANIMADOS -->
            <path id="f_cold" d="M 50 400 L 150 400 L 150 150 L 250 150" class="flow-line" stroke="var(--cold-blue)" />
            <path id="f_to_gas" d="M 410 130 L 650 130 L 650 350 L 600 350" class="flow-line" stroke="#f1c40f" />
            <path id="f_solar_direct" d="M 410 130 L 650 130 L 650 250 L 750 250" class="flow-line" stroke="var(--solar-orange)" />
            <path id="f_bridge_maint" d="M 150 250 L 550 250 L 550 350" class="flow-line" stroke="var(--cold-blue)" />
            <path id="f_out_gas" d="M 550 420 L 550 470 L 750 470" class="flow-line" stroke="var(--hot-red)" />
            
            <text x="680" y="490" class="label">DUCHA / CONSUMO</text>
        </svg>
    </div>

    <div id="info-panel" class="info-panel">
        <h3 id="mode-title" style="margin-top:0">Configuración Seleccionada</h3>
        <p id="mode-desc"></p>
    </div>
</div>

<script>
    function setSim(mode) {
        const panel = document.getElementById('info-panel');
        const desc = document.getElementById('mode-desc');
        const title = document.getElementById('mode-title');
        
        // Reset General
        document.querySelectorAll('.flow-line').forEach(f => f.style.display = 'none');
        document.querySelectorAll('.valve').forEach(v => v.setAttribute('fill', 'var(--valve-open)'));
        panel.style.display = 'block';

        if (mode === 'sunny') {
            title.innerText = "☀️ MODO VERANO: SOLAR DIRECTO";
            // Lógica: Entra al solar, sale directo a la casa. Bypass y Calefón cerrados.
            document.getElementById('f_cold').style.display = 'block';
            document.getElementById('f_solar_direct').style.display = 'block';
            document.getElementById('v_bridge').setAttribute('fill', 'var(--valve-closed)');
            desc.innerHTML = "El agua se calienta al 100% en el <b>Heat Pipe</b>. Las válvulas de bypass dirigen el flujo evitando el calefón de gas, logrando ahorro total de combustible [Manual Técnico].";
        } 
        else if (mode === 'cloudy') {
            title.innerText = "☁️ MODO INVIERNO: EN SERIE (Solar + Gas)";
            // Lógica: Entra al solar, sale hacia el calefón, del calefón a la casa.
            document.getElementById('f_cold').style.display = 'block';
            document.getElementById('f_to_gas').style.display = 'block';
            document.getElementById('f_out_gas').style.display = 'block';
            document.getElementById('v_bridge').setAttribute('fill', 'var(--valve-closed)');
            document.getElementById('v_direct').setAttribute('fill', 'var(--valve-closed)');
            desc.innerHTML = "El termotanque solar precalienta el agua. Esta entra al calefón a gas, que solo se encenderá si el sol no alcanzó la temperatura de seteo. Es la forma más eficiente de usar el respaldo [Fuente: Guía de Estudio].";
        }
        else if (mode === 'maint') {
            title.innerText = "🔧 MODO MANTENIMIENTO: SOLO GAS";
            // Lógica: El solar se aísla. El agua va por el puente al calefón.
            document.getElementById('f_cold').setAttribute('d', 'M 50 400 L 150 400 L 150 250');
            document.getElementById('f_cold').style.display = 'block';
            document.getElementById('f_bridge_maint').style.display = 'block';
            document.getElementById('f_out_gas').style.display = 'block';
            document.getElementById('v_in').setAttribute('fill', 'var(--valve-closed)');
            document.getElementById('v_direct').setAttribute('fill', 'var(--valve-closed)');
            desc.innerHTML = "Se cierran las llaves del sistema solar para limpieza de tubos o cambio de <b>ánodo de magnesio</b>. El agua fría pasa por el equipo <b>IONIS</b> y va directo al calefón a gas para no interrumpir el servicio.";
        }
    }
</script>
</body>
</html>
