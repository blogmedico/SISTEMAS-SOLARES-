<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TK-8A Pro: Simulador Algoritmo Éxito (Manual)</title>
    <style>
        :root {
            --lcd-bg: #0c0c0c; --lcd-red: #ff3232; --lcd-yellow: #f1c40f;
            --lcd-green: #2ecc71; --lcd-blue: #3498db; --tk-gray: #f2f4f7;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #1a202c; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .tk-case { width: 620px; background: var(--tk-gray); border-radius: 12px; padding: 35px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); border: 3px solid #94a3b8; position: relative; }
        .brand { position: absolute; top: 15px; left: 35px; font-weight: bold; color: #1e293b; font-style: italic; }
        .model { position: absolute; top: 15px; right: 35px; font-weight: 900; color: #e11d48; font-size: 1.2rem; }

        .lcd { background: var(--lcd-bg); height: 260px; border-radius: 12px; border: 10px solid #334155; padding: 20px; position: relative; color: white; margin-bottom: 40px; margin-top: 15px; box-shadow: inset 0 0 30px black; }
        .clock { position: absolute; top: 15px; left: 140px; font-family: monospace; font-size: 1.8rem; color: var(--lcd-green); letter-spacing: 2px; }
        .temp { font-size: 5.5rem; font-weight: 900; color: var(--lcd-red); position: absolute; top: 70px; left: 40px; }

        .level-oval { position: absolute; right: 45px; top: 35px; width: 120px; height: 165px; border: 3px solid #222; border-radius: 50% / 45%; display: flex; flex-direction: column-reverse; overflow: hidden; background: #080808; }
        .level-seg { height: 25%; width: 100%; border-top: 2px solid #111; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: rgba(255,255,255,0.05); }
        .active-100 { background: var(--lcd-red); color: white; }
        .active-75 { background: var(--lcd-yellow); color: white; }
        .active-50 { background: var(--lcd-green); color: white; }
        .active-25 { background: var(--lcd-blue); color: white; }

        .labels { position: absolute; bottom: 15px; left: 30px; right: 30px; display: flex; justify-content: space-between; font-size: 0.65rem; color: #111; font-weight: 900; }
        .on { color: var(--lcd-green); text-shadow: 0 0 10px var(--lcd-green); }

        .controls { display: flex; justify-content: space-around; align-items: center; gap: 8px; }
        .btn { width: 100px; height: 55px; border-radius: 30px; border: none; color: white; font-weight: bold; font-size: 0.65rem; cursor: pointer; transition: 0.1s; box-shadow: 0 4px #94a3b8; text-transform: uppercase; }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px #64748b; }
        
        .b-set { background: #f97316; } 
        .b-intel { background: #2563eb; } 
        .b-keep { background: #06b6d4; }  
        .b-heat { background: #db2777; }  
        .b-water { background: #059669; } 

        .track { width: 100%; height: 6px; background: #cbd5e1; margin-top: 25px; border-radius: 3px; visibility: hidden; overflow: hidden; }
        #bar { width: 100%; height: 100%; background: var(--lcd-green); transition: width 0.1s linear; }

        .success-msg { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: none; z-index: 10; border: 2px solid white; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="tk-case">
    <div class="brand">TKDZ <span style="font-weight: normal; font-size: 9px;">Solar control</span></div>
    <div class="model">TK-8A</div>
    <div id="success" class="success-msg">PROGRAMACIÓN FUE UN EXITO</div>

    <div class="lcd">
        <div class="clock" id="d-clock">12:00</div>
        <div class="temp"><span id="d-main">24</span><span style="font-size: 1.5rem; vertical-align: super;">°C</span></div>
        <div class="level-oval">
            <div class="level-seg active-100" id="s100">100</div>
            <div class="level-seg active-75" id="s75">75</div>
            <div class="level-seg active-50" id="s50">50</div>
            <div class="level-seg active-25" id="s25">25</div>
        </div>
        <div class="labels">
            <span id="lb-keep">TEMP KEEP</span>
            <span id="lb-ctemp">CONSTANT TEMP</span>
            <span id="lb-clevel">CONSTANT LEVEL</span>
            <span id="lb-heat">HEATING</span>
        </div>
    </div>

    <div class="controls">
        <button class="btn b-set" onclick="handleSet()">SET</button>
        <button class="btn b-intel">Intelligence</button>
        <button class="btn b-keep">Temp Keep</button>
        <button class="btn b-heat" onclick="adjust(1)">▲ Heating</button>
        <button class="btn b-water" onclick="adjust(-1)">▼ Water Load</button>
    </div>
    <div class="track" id="tr"><div id="bar"></div></div>
</div>

<div style="width: 620px; margin-top: 15px; background: white; padding: 15px; border-radius: 8px; border-left: 10px solid #f97316; font-size: 0.85rem;">
    <b id="g-title">MODO MONITOREO</b><br>
    <span id="g-desc">Presiona SET. Nivel fijo al 100%. Debes llevar manualmente los valores de Mantenimiento y Timers a "00".</span>
</div>

<script>
    let step = 0;
    let config = { tMin: 45, level: 100, tKeep: 10, l1: 8, l2: 17, h1: 6, h2: 19, hh: 12, mm: 0 };
    let timers = { progress: null };
    let timeLeft = 60; 

    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f=800, d=100) {
        const o=audio.createOscillator(); const g=audio.createGain();
        o.connect(g); g.connect(audio.destination); o.frequency.value=f; o.start(); setTimeout(()=>o.stop(), d);
    }

    function handleSet() {
        if (step === 10) { finishProgramming(); return; }
        step++; beep(); updateUI(); startTimer();
    }

    function adjust(v) {
        if (step === 0) return;
        beep(1000, 50);
        switch(step) {
            case 1: config.tMin = Math.max(30, Math.min(80, config.tMin + (v * 5))); break;
            case 3: config.tKeep = Math.max(0, Math.min(99, config.tKeep + v)); break;
            case 4: config.l1 = (config.l1 + v + 24) % 24; break;
            case 5: config.l2 = (config.l2 + v + 24) % 24; break;
            case 6: config.h1 = (config.h1 + v + 24) % 24; break;
            case 7: config.h2 = (config.h2 + v + 24) % 24; break;
            case 9: config.hh = (config.hh + v + 24) % 24; break;
            case 10: config.mm = (config.mm + v + 60) % 60; break;
        }
        updateUI(); startTimer();
    }

    function startTimer() {
        clearInterval(timers.progress);
        if (step === 0) { document.getElementById('tr').style.visibility = 'hidden'; return; }
        document.getElementById('tr').style.visibility = 'visible';
        timeLeft = 60;
        timers.progress = setInterval(() => {
            timeLeft--;
            document.getElementById('bar').style.width = (timeLeft * 1.66) + "%";
            if (timeLeft <= 0) { finishProgramming(); }
        }, 100);
    }

    function finishProgramming() {
        clearInterval(timers.progress);
        step = 0;
        beep(400, 500);
        updateUI();
        document.getElementById('tr').style.visibility = 'hidden';
        document.getElementById('g-title').innerText = "PROGRAMA GUARDADO";
        
        // ACTIVACIÓN AUTOMÁTICA DEL CONTACTOR TRAS 3 SEGUNDOS
        setTimeout(() => {
            beep(900, 1000); // Sonido de contactor
            document.getElementById('lb-ctemp').classList.add('on');
            document.getElementById('lb-heat').classList.add('on');
            document.getElementById('success').style.display = 'block';
            document.getElementById('g-title').innerText = "ESTADO: ACTIVO";
        }, 3000);
    }

    function updateUI() {
        const main = document.getElementById('d-main');
        const clock = document.getElementById('d-clock');
        const title = document.getElementById('g-title');
        clock.innerText = `${config.hh.toString().padStart(2,'0')}:${config.mm.toString().padStart(2,'0')}`;

        switch(step) {
            case 0: title.innerText = "MONITOREO"; main.innerText = "24"; break;
            case 1: title.innerText = "1. T° MÍNIMA (CLASE: 30)"; main.innerText = config.tMin; break;
            case 2: title.innerText = "2. NIVEL AGUA (FIJO 100%)"; main.innerText = "C1"; clock.innerText = "100%"; break;
            case 3: title.innerText = "3. TIME KEEP (BAJAR A 00)"; main.innerText = config.tKeep.toString().padStart(2,'0'); break;
            case 4: title.innerText = "4. WATER LOAD 1 (PONER 00)"; main.innerText = "L1"; clock.innerText = config.l1.toString().padStart(2,'0')+":00"; break;
            case 5: title.innerText = "5. WATER LOAD 2 (PONER 00)"; main.innerText = "L2"; clock.innerText = config.l2.toString().padStart(2,'0')+":00"; break;
            case 6: title.innerText = "6. HEATING 1 (PONER 00)"; main.innerText = "H1"; clock.innerText = config.h1.toString().padStart(2,'0')+":00"; break;
            case 7: title.innerText = "7. HEATING 2 (PONER 00)"; main.innerText = "H2"; clock.innerText = config.h2.toString().padStart(2,'0')+":00"; break;
            case 8: title.innerText = "8. VISTA RELOJ"; main.innerText = "24"; break;
            case 9: title.innerText = "9. AJUSTE HORA"; main.innerText = "HH"; clock.innerText = config.hh.toString().padStart(2,'0')+":--"; break;
            case 10: title.innerText = "10. AJUSTE MINUTOS"; main.innerText = "MM"; clock.innerText = "--:"+config.mm.toString().padStart(2,'0'); break;
        }
    }
    updateUI();
</script>
</body>
</html>
